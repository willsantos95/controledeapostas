services:
  postgres:
    image: postgres:16-alpine
    container_name: apostas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apostas
      POSTGRES_PASSWORD: apostas
      POSTGRES_DB: apostas
    ports:
      - "5432:5432"
    volumes:
      - apostas_pgdata:/var/lib/postgresql/data

volumes:
  apostas_pgdata:
