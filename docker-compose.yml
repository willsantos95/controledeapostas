services:
  postgres:
    image: postgres:16-alpine
    container_name: apostas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apostas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apostas}
      POSTGRES_DB: apostas
    ports:
      - "5432:5432"
    volumes:
      - apostas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apostas"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: apostas-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - apostas_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: apostas-backend
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://apostas:${POSTGRES_PASSWORD:-apostas}@postgres:5432/apostas
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env da raiz}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-apostas-bucket}
      S3_REGION: us-east-1
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: apostas-frontend
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  apostas_pgdata:
  apostas_miniodata:
