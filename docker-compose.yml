services:
  postgres:
    image: postgres:16-alpine
    container_name: apostas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apostas
      POSTGRES_PASSWORD: apostas
      POSTGRES_DB: apostas
    ports:
      - "5432:5432"
    volumes:
      - apostas_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: apostas-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - apostas_miniodata:/data

volumes:
  apostas_pgdata:
  apostas_miniodata:
